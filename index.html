<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PARSAI — دستیار فارسی</title>
<style>
:root{--bg:#07080d;--panel:#0d1018;--line:#ffffff12;--text:#edf3ff;--muted:#8792a8;--a:#5ee7ff;--b:#8b5cf6}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#18344c 0,transparent 38%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}
.app{width:min(1050px,100%);height:100vh;margin:auto;display:flex;flex-direction:column}.top{height:72px;padding:0 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.brand{font:900 19px Arial;letter-spacing:3px}.brand span{color:var(--a)}.online{font-size:10px;color:#6d7a91}.online i{display:inline-block;width:7px;height:7px;background:#54f2a5;border-radius:50%;box-shadow:0 0 12px #54f2a5;margin-left:7px}
.chat{flex:1;overflow:auto;padding:28px 18px 120px;scroll-behavior:smooth}.welcome{min-height:55vh;display:grid;place-items:center;text-align:center}.orb{width:82px;height:82px;border-radius:28px;margin:auto;background:radial-gradient(circle at 35% 30%,#fff,#5ee7ff 9%,#2269ff 35%,#17102d 70%);box-shadow:0 0 50px #5ee7ff35;animation:pulse 2.5s infinite}.welcome h1{font-size:clamp(27px,5vw,48px);margin:22px 0 10px;letter-spacing:-2px}.welcome p{color:var(--muted);font-size:13px}.suggest{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}.suggest button{width:auto}
@keyframes pulse{50%{transform:scale(1.05);box-shadow:0 0 80px #5ee7ff55}}
.msg{display:flex;margin:18px 0;gap:10px;align-items:flex-start}.msg.user{justify-content:flex-start}.msg.ai{justify-content:flex-start}.bubble{max-width:min(760px,88%);padding:14px 16px;border:1px solid var(--line);background:#ffffff06;border-radius:18px;line-height:2;font-size:14px;white-space:pre-wrap;word-break:break-word}.user .bubble{background:linear-gradient(135deg,#5ee7ff14,#8b5cf608);border-color:#5ee7ff20}.avatar{width:31px;height:31px;border-radius:10px;flex:none;display:grid;place-items:center;background:#ffffff08;color:var(--a);font:bold 10px Arial}.typing{display:flex;gap:5px;padding:10px}.typing i{width:6px;height:6px;background:var(--a);border-radius:50%;animation:b .8s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes b{50%{opacity:.2;transform:translateY(-3px)}}
.composer{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:min(900px,calc(100% - 28px));padding:9px;border:1px solid #ffffff18;background:#0b0e16e8;backdrop-filter:blur(18px);border-radius:18px;box-shadow:0 20px 70px #0008;display:flex;gap:8px;z-index:4}.composer textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:14px Tahoma;padding:11px;min-height:44px;max-height:130px}.btn{width:45px;height:45px;border:1px solid var(--line);border-radius:13px;background:#ffffff08;color:#dcecff;cursor:pointer}.send{background:var(--a);color:#031014;border:0;font-size:18px}.btn:hover{border-color:#5ee7ff55}.hint{position:absolute;bottom:-20px;right:12px;font-size:9px;color:#58657a}
#voice{font-size:16px}.voiceOn{color:var(--a)!important;border-color:#5ee7ff66!important}
.clear{font-size:10px;color:var(--muted);cursor:pointer}
@media(max-width:600px){.top{height:60px}.chat{padding:18px 10px 120px}.bubble{font-size:13px}.composer{bottom:10px}.welcome h1{font-size:30px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">PARS<span>AI</span></div><div><span class="clear" id="clear">پاک کردن گفتگو</span> <span class="online"><i></i>ONLINE</span></div></header>
<main class="chat" id="chat">
<section class="welcome" id="welcome">
<div>
<div class="orb"></div>
<h1>سلام، من PARSAI هستم.</h1>
<p>فارسی صحبت کن؛ سؤال بپرس، ایده بده، کد بخواه یا حتی با من گفت‌وگو کن.</p>
<div class="suggest"><button class="btn" data-q="یک ایده خفن برای یک سایت HTML بده">ایده سایت</button><button class="btn" data-q="فرق هوش مصنوعی و یادگیری ماشین چیست؟">توضیح بده</button><button class="btn" data-q="یک کد HTML خفن و کوتاه بنویس">کدنویسی</button></div>
</div>
</section>
</main>
<div class="composer">
<button class="btn" id="voice" title="صحبت با میکروفون">🎙</button>
<textarea id="input" rows="1" placeholder="پیامت را بنویس..."></textarea>
<button class="btn send" id="send">➤</button>
<div class="hint">Enter برای ارسال · Shift+Enter برای خط جدید</div>
</div>
</div>
<script src="https://js.puter.com/v2/"></script>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input'),send=document.getElementById('send'),welcome=document.getElementById('welcome');
let messages=JSON.parse(localStorage.getItem('parsai-chat')||'[]');
const system={role:'system',content:`تو PARSAI هستی؛ یک دستیار هوش مصنوعی فارسی‌زبان، صمیمی، باهوش و کاربردی. همیشه پاسخ را به فارسی بده مگر کاربر زبان دیگری بخواهد. اگر سؤال فنی بود دقیق و با مثال جواب بده. اگر لازم بود کد کامل و قابل اجرا بده. ادعا نکن انسان هستی. پاسخ‌ها را واضح و نه بی‌دلیل طولانی بنویس.`};
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function add(role,text){let d=document.createElement('div');d.className='msg '+role;d.innerHTML=`<div class="avatar">${role==='user'?'YOU':'AI'}</div><div class="bubble">${esc(text)}</div>`;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function render(){if(messages.length){welcome.style.display='none';messages.forEach(m=>add(m.role==='user'?'user':'ai',m.content))}}
function save(){localStorage.setItem('parsai-chat',JSON.stringify(messages.slice(-30)))}
function typing(){let d=document.createElement('div');d.className='msg ai';d.id='typing';d.innerHTML='<div class="avatar">AI</div><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>';chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
async function ask(q){
q=q.trim();if(!q)return;
welcome.style.display='none';add('user',q);messages.push({role:'user',content:q});save();input.value='';input.style.height='auto';typing();send.disabled=true;
try{
const r=await puter.ai.chat([system,...messages],{model:'gpt-5.6-luna',stream:true,tools:[{type:'web_search'}]});
document.getElementById('typing')?.remove();let text='';let d=document.createElement('div');d.className='msg ai';d.innerHTML='<div class="avatar">AI</div><div class="bubble"></div>';chat.appendChild(d);let bubble=d.querySelector('.bubble');
for await(const part of r){if(part.type==='text'){text+=part.text;bubble.textContent=text;chat.scrollTop=chat.scrollHeight}}
if(!text) text='پاسخی دریافت نشد.';
bubble.textContent=text;messages.push({role:'assistant',content:text});save();speak(text);
}catch(e){document.getElementById('typing')?.remove();add('ai','خطا در ارتباط با هوش مصنوعی: '+(e.message||e));}
send.disabled=false;input.focus();
}
send.onclick=()=>ask(input.value);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(input.value)}});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,130)+'px'});
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q));
document.getElementById('clear').onclick=()=>{messages=[];localStorage.removeItem('parsai-chat');location.reload()};
function speak(text){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text.replace(/```[\s\S]*?```/g,''));u.lang='fa-IR';u.rate=.95;speechSynthesis.speak(u)}
const V=window.SpeechRecognition||window.webkitSpeechRecognition;
if(V){let rec=new V();rec.lang='fa-IR';rec.interimResults=false;rec.onresult=e=>{input.value=e.results[0][0].transcript;ask(input.value)};rec.onstart=()=>document.getElementById('voice').classList.add('voiceOn');rec.onend=()=>document.getElementById('voice').classList.remove('voiceOn');document.getElementById('voice').onclick=()=>rec.start()}else document.getElementById('voice').onclick=()=>alert('تشخیص صدای فارسی در این مرورگر پشتیبانی نمی‌شود.');
render();
</script>
</body>
</html>
